name: music_helper
description: "音乐助手 - 跨平台调音器与和弦识别工具"
publish_to: 'none'
version: 1.0.20261015+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  record: ^5.1.2
  shared_preferences: ^2.3.4
  path_provider: ^2.1.5
  ffi: ^2.1.3

dependency_overrides:
  record_linux: 0.7.2
  record_platform_interface: 1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
